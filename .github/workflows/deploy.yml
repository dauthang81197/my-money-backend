name: CI/CD for backend

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install

      - name: Run Lint
        run: yarn lint

  build:
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker images
        run: |
          docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/my-money-backend:${GITHUB_SHA::8} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/my-money-backend:${GITHUB_SHA::8} ${{ secrets.DOCKER_USERNAME }}/my-money-backend:latest

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-money-backend:latest
        if: github.ref == 'refs/heads/develop'

      - name: Push Docker image with SHA tag
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-money-backend:${GITHUB_SHA::8}
        if: github.ref == 'refs/heads/develop'

  deploy:
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull new images
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/my-money-backend:latest

      - name: Deploy stack on Ubuntu Swarm
        run: |
          docker stack deploy -c docker-compose.yml my-money-backend-stack
